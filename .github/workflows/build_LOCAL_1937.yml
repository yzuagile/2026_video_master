name: Build and Publish WPF App

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore framework/framework.sln

    - name: Run tests
      run: |
        dotnet test framework/VideoMaster.Tests/VideoMaster.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=TestResults/results.trx"

    - name: Publish test report
      uses: dorny/test-reporter@v3
      if: ${{ always() }}
      with:
        name: "Unit Tests"
        path: "framework/**/TestResults/*.trx"
        reporter: dotnet-trx
        use-actions-summary: 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build app
      run: dotnet build framework/framework/framework.csproj -c Release --no-restore

    - name: Publish self-contained executable
      run: dotnet publish framework/framework/framework.csproj -c Release --self-contained --runtime win-x64 -o publish

    - name: Download and inject FFmpeg
      run: |
        echo "正在下載 FFmpeg 最新版..."
        curl.exe -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
        
        echo "正在解壓縮 ffmpeg.exe 並放進 publish 資料夾..."
        # 使用 windows-latest 內建的 7z 工具，直接把 ffmpeg.exe 抽取出來丟進 publish 目錄
        7z e ffmpeg.zip -o"publish" "ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe"
        
        echo "清理暫存壓縮檔..."
        del ffmpeg.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WPF-App-Executable
        path: publish/

    - name: Send Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "Build Status: ${{ job.status }}",
            "attachments": [
              {
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {
                    "title": "Repo",
                    "value": "${{ github.repository }}",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "${{ job.status }}",
                    "short": true
                  },
                  {
                    "title": "Triggered by",
                    "value": "${{ github.actor }}",
                    "short": true
                  }
                ]
              }
            ]
          }