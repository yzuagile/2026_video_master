name: Build and Publish WPF App

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore framework/framework.sln

    - name: Run tests
      run: |
        dotnet test framework/VideoMaster.Tests/VideoMaster.Tests.csproj -c Release --no-restore \
          --logger "trx;LogFileName=TestResults/results.trx" \
          --results-directory framework/VideoMaster.Tests/TestResults \
          --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - name: Publish test report
      uses: dorny/test-reporter@v3
      if: ${{ always() }}
      with:
        name: "Unit Tests"
        path: "framework/**/TestResults/*.trx"
        reporter: dotnet-trx
        use-actions-summary: 'true'
      env:  
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload coverage report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: Coverage Report
        path: framework/VideoMaster.Tests/TestResults/**/*.xml

    - name: Parse and display coverage summary
      if: ${{ always() }}
      run: |
        $xmlPath = Get-Item -Path "framework/VideoMaster.Tests/TestResults/**/coverage.cobertura.xml" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($xmlPath) {
          [xml]$xml = Get-Content $xmlPath.FullName
          $lineCoverage = $xml.coverage.'line-rate'
          $branchCoverage = $xml.coverage.'branch-rate'
          $linePercent = [Math]::Round([double]$lineCoverage * 100, 2)
          $branchPercent = [Math]::Round([double]$branchCoverage * 100, 2)
          
          $summary = @"
        ## Code Coverage Report
        
        | Metric | Coverage |
        |--------|----------|
        | Line Coverage | $linePercent% |
        | Branch Coverage | $branchPercent% |
        "@
          
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
        }
      shell: pwsh

    - name: Build app
      run: dotnet build framework/framework/framework.csproj -c Release --no-restore

    - name: Publish self-contained executable
      run: dotnet publish framework/framework/framework.csproj -c Release --self-contained --runtime win-x64 -o publish


    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WPF-App-Executable
        path: publish/

    - name: Send Slack Notification
      if: always()
      uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "Build Status: ${{ job.status }}",
            "attachments": [
              {
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {
                    "title": "Repo",
                    "value": "${{ github.repository }}",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "${{ job.status }}",
                    "short": true
                  },
                  {
                    "title": "Triggered by",
                    "value": "${{ github.actor }}",
                    "short": true
                  }
                ]
              }
            ]
          }